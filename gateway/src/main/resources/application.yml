server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthenticationFilter

        - id: person-service
          uri: lb://person-service
          predicates:
            - Path=/api/v1/persons/**
          filters:
            - AuthenticationFilter

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/internal/accounts/**
          filters:
            - AuthenticationFilter

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true

# JWT Configuration
jwt:
  # This should be a long, random string and stored securely (e.g., in environment variables or a secret manager)
  secret: ${JWT_SECRET:41Dk432fD23423aADF342lkj234ADF987asdf987ADF345lkj345ADF345ADF345ADF}
