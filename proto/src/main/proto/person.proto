syntax = "proto3";

option java_package = "com.company.banking.grpc.person";
option java_multiple_files = true;

package person;

service PersonService {
  rpc GetPersonById(PersonRequest) returns (PersonResponse);
  rpc CreatePerson(CreatePersonRequest) returns (PersonResponse);
}

message PersonRequest {
  int64 person_id = 1;
}

message CreatePersonRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
}

message PersonResponse {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
}
